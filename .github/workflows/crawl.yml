name: 뮤지컬 공모 수집

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (UTC 기준, 기본 브랜치에서만 실행됨)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: musical-hub-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: 수집
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MH_DEBUG_DIR: ${{ runner.temp }}/mh-debug
        run: python scraper/main.py

      - name: 받아온 원본 HTML 보관 (사이트 구조 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-debug-html
          path: ${{ runner.temp }}/mh-debug
          retention-days: 7
          if-no-files-found: ignore

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "공모·공연·기사 데이터 갱신"
            git pull --rebase
            git push
          fi
