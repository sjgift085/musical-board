<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뮤지컬 작가 공모 알림판</title>
  <link rel="stylesheet" href="style.css?v=20261012-2">
</head>
<body>
  <header class="top">
    <div>
      <h1>🎭 뮤지컬 작가 공모 알림판</h1>
      <p class="sub" id="updated">불러오는 중…</p>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="contests" class="active">공모 <span id="newCount" class="pill" hidden></span></button>
    <button type="button" data-tab="rankings">예매 순위</button>
    <button type="button" data-tab="news">업계 소식</button>
  </nav>

  <main>
    <section id="tab-contests" class="panel">
      <div class="toolbar">
        <input type="search" id="contestSearch" placeholder="공모 제목·기관 검색" autocomplete="off">
        <select id="contestSort" aria-label="정렬">
          <option value="new">새로 올라온 순</option>
          <option value="deadline">마감 임박순</option>
        </select>
      </div>
      <div class="filters">
        <div class="chips" id="sourceChips"></div>
        <label class="check"><input type="checkbox" id="onlyRelevant" checked> 뮤지컬·창작 관련만</label>
        <label class="check"><input type="checkbox" id="onlyNew"> 새 공모만</label>
        <label class="check"><input type="checkbox" id="hideClosed" checked> 마감 지난 것 숨기기</label>
      </div>
      <ul class="cards" id="contestList"></ul>
      <p class="empty" id="contestEmpty" hidden></p>
    </section>

    <section id="tab-rankings" class="panel" hidden>
      <div class="chips" id="rankChips"></div>
      <p class="rank-meta" id="rankMeta"></p>
      <ol class="ranks" id="rankList"></ol>
      <p class="empty" id="rankEmpty" hidden></p>
    </section>

    <section id="tab-news" class="panel" hidden>
      <div class="toolbar">
        <input type="search" id="newsSearch" placeholder="정책·포럼·협회·작품 소식 검색" autocomplete="off">
      </div>
      <div class="chips news-chips" id="newsChips"></div>
      <ul class="news" id="newsList"></ul>
      <p class="empty" id="newsEmpty" hidden></p>
    </section>
  </main>

  <footer class="foot">
    <details>
      <summary>수집 상태</summary>
      <ul id="statusList"></ul>
    </details>
    <p>공모 정보: 아트누리 · 문화포털 · 아르코 통합플랫폼 · 스토리움 · 지역(충주문화관광재단·충북문화재단) / 예매 순위: 인터파크(NOL)·예스24·멜론티켓 / 업계 소식: Google·네이버 뉴스.
      정확한 내용은 반드시 원문에서 확인하세요.</p>
  </footer>

  <script src="app.js?v=20261012-2"></script>
</body>
</html>
