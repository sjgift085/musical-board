<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뮤지컬 작가 공모 알림판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>🎭 뮤지컬 작가 공모 알림판</h1>
      <p class="sub" id="updated">불러오는 중…</p>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="contests" class="active">공모 <span id="newCount" class="pill" hidden></span></button>
    <button type="button" data-tab="shows">새로 개막한 뮤지컬</button>
    <button type="button" data-tab="news">업계 소식</button>
  </nav>

  <main>
    <section id="tab-contests" class="panel">
      <div class="toolbar">
        <input type="search" id="contestSearch" placeholder="공모 제목·기관 검색" autocomplete="off">
        <select id="contestSort" aria-label="정렬">
          <option value="new">새로 올라온 순</option>
          <option value="deadline">마감 임박순</option>
        </select>
      </div>
      <div class="filters">
        <div class="chips" id="sourceChips"></div>
        <label class="check"><input type="checkbox" id="onlyRelevant" checked> 뮤지컬·창작 관련만</label>
        <label class="check"><input type="checkbox" id="onlyNew"> 새 공모만</label>
        <label class="check"><input type="checkbox" id="hideClosed" checked> 마감 지난 것 숨기기</label>
      </div>
      <ul class="cards" id="contestList"></ul>
      <p class="empty" id="contestEmpty" hidden></p>
    </section>

    <section id="tab-shows" class="panel" hidden>
      <div class="toolbar">
        <input type="search" id="showSearch" placeholder="작품명·공연장 검색" autocomplete="off">
        <select id="showRange" aria-label="기간">
          <option value="opened">최근 개막</option>
          <option value="upcoming">개막 예정</option>
          <option value="all">전체</option>
        </select>
      </div>
      <ul class="shows" id="showList"></ul>
      <p class="empty" id="showEmpty" hidden></p>
      <h2 class="section-title">개막·초연 소식 기사</h2>
      <ul class="news" id="openingNews"></ul>
    </section>

    <section id="tab-news" class="panel" hidden>
      <div class="toolbar">
        <input type="search" id="newsSearch" placeholder="기사 제목 검색" autocomplete="off">
      </div>
      <ul class="news" id="newsList"></ul>
      <p class="empty" id="newsEmpty" hidden></p>
    </section>
  </main>

  <footer class="foot">
    <details>
      <summary>수집 상태</summary>
      <ul id="statusList"></ul>
    </details>
    <p>공모 정보: 아트누리 · 문화포털 · 아르코 통합플랫폼 · 스토리움 · OTR / 공연 정보: PlayDB / 기사: Google·네이버 뉴스.
      정확한 내용은 반드시 원문에서 확인하세요.</p>
  </footer>

  <dialog id="showDialog">
    <form method="dialog"><button class="close" aria-label="닫기">✕</button></form>
    <div id="showDetail"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
